name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: >-
          hub-upgrade only: the release to upgrade from instead of the
          derived previous one (vX.Y.Z, published), to run the scenario's
          migration branch; not a supported skip-release path
        required: false
        default: ''
      macos-tests:
        description: >-
          also run go vet and go test of every package on macOS, as the
          release workflow's macos job does (an owner-approved run before
          a merge; never required)
        type: boolean
        required: false
        default: false

# A pull request runs lint, build, the tests of every package on Linux
# and on Windows, both scenario legs and the installer container. On
# Windows its tests run in test-windows-pr, because a Windows-only
# failure found on master costs more than the job's ten minutes; the
# matrix leg test (windows-latest) keeps its name on a pull request and
# passes without testing, because the master ruleset requires every check
# by name. That matrix leg and the race runs run on every push to
# master, nightly, on a manual run, and on a release prepare pull request
# (branch release/v<version>) (docs/DEVELOPMENT.md, "Which checks run
# where"). macOS runs in the release workflow, at the tag, and here only
# in test-macos on a manual run that asks for it: GitHub's macOS runners
# can go unassigned for long stretches, so a Mac-only break stops a
# release, never a merge.

permissions:
  contents: read
# No checkout keeps the token in its git configuration
# (persist-credentials: false): no step pushes, and the one git fetch reads
# this public repository anonymously.

# One run per branch: an agent pushing fixups in quick succession should
# not queue stale 3-OS matrices. Master merges are never cancelled — every
# merged commit keeps its full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true   # govulncheck scans the stdlib: always use the newest patch
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      # Tests and scripts stop only the processes they started
      # (docs/DEVELOPMENT.md, "Processes and state in tests").
      - name: no process stops by name
        run: sh scripts/check-process-stops.sh
      # Machine-local tool caches (a PowerShell module analysis cache came
      # in with #197) never belong in the tree.
      - name: no tool caches in the tree
        run: sh scripts/check-tool-caches.sh
      # A v0.6-v0.9 version in a current guide reads as the current minimum
      # (docs/DEVELOPMENT.md, "Version mentions in the documentation").
      - name: no unmarked old versions in the docs
        run: sh scripts/check-doc-versions.sh
      # A copied example must name commands, flags, routes and tools that
      # exist (docs/DEVELOPMENT.md, "Examples in the documentation").
      - name: no stale names in the docs' examples
        run: sh scripts/check-doc-examples.sh
      # The tasks console's script against fake page and hub objects, on
      # the runner's own Node (no setup action, no packages); a failed case
      # exits non-zero and fails the job.
      - name: tasks console harness
        run: |
          node scripts/test-epic-details.mjs
          node scripts/test-features-view.mjs
      # node --check on every console page's script. The test skips where
      # node is missing; here it must run, so a missing node fails it.
      - name: console page scripts parse
        env:
          AIMEM_TEST_REQUIRE_NODE: "1"
        run: go test -count=1 -run '^TestConsoleScriptsSyntax$' ./internal/server/
      # Both tools are tool directives in go.mod: the versions go.sum pins,
      # built on the runner's Go 1.26 like everything else.
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
      RUN: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
    steps:
      - name: on a pull request this leg runs on master
        if: env.RUN != 'true'
        run: echo "On a pull request the Windows tests run in test-windows-pr; this leg runs them on pushes to master, nightly and on release/ pull requests (docs/DEVELOPMENT.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.RUN == 'true'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.RUN == 'true'
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        if: env.RUN == 'true'
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
        if: env.RUN == 'true'
      # internal/installer runs about 8 minutes on the Windows runner, near
      # go test's default 10-minute package timeout; it hit it once
      # (master, 2026-11-14). The explicit limit leaves room; a test that
      # hangs still fails.
      - run: go test -timeout 20m ./...
        if: env.RUN == 'true'
      # The end-to-end identity test races concurrent redemptions against
      # the rig's shared state. The race detector needs cgo, which the
      # Ubuntu runner has; 50 runs keep a lost update from passing by luck.
      - name: identity racing redemptions under the race detector
        if: matrix.os == 'ubuntu-latest' && env.FULL == 'true'
        run: go test -race -count=50 -run '^TestIdentityRoutesEndToEndWithFakeVerifier$' ./internal/server/

  # On a pull request, the full Windows test leg under the name the master
  # ruleset requires: go vet and go test of every package, as the
  # `test (windows-latest)` leg runs them on master. Windows-only
  # failures reached master three times while a pull request tested only
  # part of the suite here (#333 and #336 on 2026-10-30, #406 on
  # 2026-11-21). The leg takes about ten minutes and runs beside the
  # reviews.
  # A release/ pull request runs the matrix leg instead, and master and
  # nightly skip this job.
  test-windows-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      # The runner's default shell, as in the matrix leg: the installer
      # tests start boot.ps1 under Windows PowerShell from it. The timeout
      # is the matrix leg's (internal/installer alone runs about 8 minutes).
      - run: go vet ./...
      - run: go test -timeout 20m ./...

  # The tests on macOS before a merge, only when a manual run asks for them
  # (the macos-tests input): the release workflow's macos job, without its
  # build and launchd check. It never runs on a pull request, a push or the
  # nightly run, and no ruleset requires it, as a macOS runner can go
  # unassigned for long stretches (docs/DEVELOPMENT.md, "Which checks run
  # where").
  test-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos-tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
      - run: go test ./...

  # The documented usage scenarios (docs/scenarios), run against the real
  # binary started as a hub and as a workstation. Both legs run on every
  # event, a pull request included: the Windows leg takes about a minute
  # and a half.
  scenario:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # The lint job's vet and staticcheck do not see tagged files.
      - run: go vet -tags scenario ./internal/scenario/...
      - run: go test -tags scenario -count=1 -v ./internal/scenario/...

  # install-hub.sh's install-only mode (AIMEM_NO_SERVICE=1) in a container
  # without systemd, from a local build: install, serve with the printed
  # command, refuse an upgrade while it runs, upgrade once it is stopped.
  install-hub-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: bash scripts/check-install-hub-container.sh

  # Whether the upgrade checks below run (scripts/upgrade-scope.sh, which
  # says why in its log): nightly, on a manual run, on a release prepare
  # pull request from this repository's release/ branches, and on any other
  # pull request from this repository that changes the installers or the
  # upgrade checks. Never on a fork's pull request: the jobs below check
  # that themselves too, since a fork's pull request carries its own copy
  # of the script.
  upgrade-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/upgrade-scope.sh

  # A real client upgrade from the previous release to this tree
  # (scripts/check-client-upgrade.sh): the previous release's one-liner
  # installs it, its own `aimem upgrade` installs an export of the tree, a
  # failed upgrade rolls back, and the lists a session sees after it are the
  # tree's. The previous release comes from the tags (full history). It
  # installs into the runner's account, so it runs only where upgrade-scope
  # says; macOS on a release prepare pull request and a manual run only,
  # since a starved macOS runner must not hold an ordinary pull request
  # (docs/DEVELOPMENT.md, "Release gate").
  client-upgrade:
    needs: upgrade-scope
    if: >-
      needs.upgrade-scope.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/'))) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Build on the Go that setup-go installed, never a toolchain that
      # go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - if: runner.os != 'Windows'
        run: bash scripts/check-client-upgrade.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-client-upgrade.ps1

  # A hub's upgrade from the previous release to this tree
  # (scripts/check-hub-upgrade.sh), in the pinned container the hub
  # installer's check uses: the previous release's own install-hub.sh
  # installs its hub, that hub writes a task, a comment, a memory and a
  # team, the tree's install-hub.sh upgrades it, and the tree reads it all
  # back; the state copy is the previous state and each journal is at the
  # tree's schema. It runs where client-upgrade runs (upgrade-scope); a
  # manual run may name the release to start from (the `from` input), and
  # only a manual run.
  hub-upgrade:
    needs: upgrade-scope
    if: >-
      needs.upgrade-scope.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: toolchain is the runner's Go 1.26
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - env:
          AIMEM_UPGRADE_FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.from || '' }}
        run: bash scripts/check-hub-upgrade.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      # The single static binary is the whole deployment story: CGO off, so
      # it runs on any glibc/musl host without a toolchain.
      - run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      - run: ./aimem state-root
