name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A pull request runs the fast set: lint, build, the Linux tests and
# scenarios, the installer container. The Windows and macOS legs and the
# race runs, which set a pull request's wall time, run on every push to
# master, nightly, on a manual run, and on a release prepare pull request
# (branch release/v<version>), so the release gate still sees them
# (docs/DEVELOPMENT.md, "Which checks run where"). The legs keep their
# names on a pull request and pass without testing, because the master
# ruleset requires every check by name.

permissions:
  contents: read

# One run per branch: an agent pushing fixups in quick succession should
# not queue stale 3-OS matrices. Master merges are never cancelled — every
# merged commit keeps its full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true   # govulncheck scans the stdlib: always use the newest patch
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      # Tests and scripts stop only the processes they started
      # (docs/DEVELOPMENT.md, "Processes and state in tests").
      - name: no process stops by name
        run: sh scripts/check-process-stops.sh
      # Machine-local tool caches (a PowerShell module analysis cache came
      # in with #197) never belong in the tree.
      - name: no tool caches in the tree
        run: sh scripts/check-tool-caches.sh
      # A v0.6-v0.9 version in a current guide reads as the current minimum
      # (docs/DEVELOPMENT.md, "Version mentions in the documentation").
      - name: no unmarked old versions in the docs
        run: sh scripts/check-doc-versions.sh
      # A copied example must name commands, flags, routes and tools that
      # exist (docs/DEVELOPMENT.md, "Examples in the documentation").
      - name: no stale names in the docs' examples
        run: sh scripts/check-doc-examples.sh
      # The tasks console's script against fake page and hub objects, on
      # the runner's own Node (no setup action, no packages); a failed case
      # exits non-zero and fails the job.
      - name: tasks console harness
        run: node scripts/test-epic-details.mjs
      # GOTOOLCHAIN inline: these @latest tools may declare a newer Go than
      # our pinned 1.26, and setup-go v7 exports GOTOOLCHAIN=local via
      # GITHUB_ENV, which clobbers workflow/job-level env — only a shell
      # assignment reliably outranks it. Build/test stay on the pinned 1.26.
      - name: staticcheck
        run: GOTOOLCHAIN=auto go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: GOTOOLCHAIN=auto go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
      RUN: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
    steps:
      - name: on a pull request this leg runs on master
        if: env.RUN != 'true'
        run: echo "The ${{ matrix.os }} tests run on pushes to master, nightly and on release/ pull requests (docs/DEVELOPMENT.md)."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        if: env.RUN == 'true'
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
        if: env.RUN == 'true'
      - run: go test ./...
        if: env.RUN == 'true'
      # The client installer's launchd agents, against the runner's real
      # launchd: install, upgrade in place, uninstall.
      - name: macOS install registers launchd agents
        if: matrix.os == 'macos-latest' && env.RUN == 'true'
        run: bash scripts/check-launchd-install.sh
      # The end-to-end identity test races concurrent redemptions against
      # the rig's shared state. The race detector needs cgo, which the
      # Ubuntu runner has; 50 runs keep a lost update from passing by luck.
      - name: identity racing redemptions under the race detector
        if: matrix.os == 'ubuntu-latest' && env.FULL == 'true'
        run: go test -race -count=50 -run '^TestIdentityRoutesEndToEndWithFakeVerifier$' ./internal/server/

  # The documented usage scenarios (docs/scenarios), run against the real
  # binary started as a hub and as a workstation.
  scenario:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RUN: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
    steps:
      - name: on a pull request this leg runs on master
        if: env.RUN != 'true'
        run: echo "The ${{ matrix.os }} scenarios run on pushes to master, nightly and on release/ pull requests (docs/DEVELOPMENT.md)."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # The lint job's vet and staticcheck do not see tagged files.
      - run: go vet -tags scenario ./internal/scenario/...
        if: env.RUN == 'true'
      - run: go test -tags scenario -count=1 -v ./internal/scenario/...
        if: env.RUN == 'true'

  # install-hub.sh's install-only mode (AIMEM_NO_SERVICE=1) in a container
  # without systemd, from a local build: install, serve with the printed
  # command, refuse an upgrade while it runs, upgrade once it is stopped.
  install-hub-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: bash scripts/check-install-hub-container.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      # The single static binary is the whole deployment story: CGO off, so
      # it runs on any glibc/musl host without a toolchain.
      - run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      - run: ./aimem state-root
