name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch: an agent pushing fixups in quick succession should
# not queue stale 3-OS matrices. Master merges are never cancelled — every
# merged commit keeps its full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true   # govulncheck scans the stdlib: always use the newest patch
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      # Tests and scripts stop only the processes they started
      # (docs/DEVELOPMENT.md, "Processes and state in tests").
      - name: no process stops by name
        run: sh scripts/check-process-stops.sh
      # GOTOOLCHAIN inline: these @latest tools may declare a newer Go than
      # our pinned 1.26, and setup-go v7 exports GOTOOLCHAIN=local via
      # GITHUB_ENV, which clobbers workflow/job-level env — only a shell
      # assignment reliably outranks it. Build/test stay on the pinned 1.26.
      - name: staticcheck
        run: GOTOOLCHAIN=auto go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: GOTOOLCHAIN=auto go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
      - run: go test ./...
      # The end-to-end identity test races concurrent redemptions against
      # the rig's shared state. The race detector needs cgo, which the
      # Ubuntu runner has; 50 runs keep a lost update from passing by luck.
      - name: identity racing redemptions under the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=50 -run '^TestIdentityRoutesEndToEndWithFakeVerifier$' ./internal/server/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      # The single static binary is the whole deployment story: CGO off, so
      # it runs on any glibc/musl host without a toolchain.
      - run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      - run: ./aimem state-root
