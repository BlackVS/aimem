name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: >-
          hub-upgrade only: the release to upgrade from instead of the
          derived previous one (vX.Y.Z, published), to run the scenario's
          migration branch; not a supported skip-release path
        required: false
        default: ''

# A pull request runs the fast set: lint, build, the Linux tests and
# scenarios, the installer container. The Windows legs and the race runs,
# which set a pull request's wall time, run on every push to master,
# nightly, on a manual run, and on a release prepare pull request (branch
# release/v<version>), so the release gate still sees them
# (docs/DEVELOPMENT.md, "Which checks run where"). The Windows legs keep
# their names on a pull request and pass without testing, because the
# master ruleset requires every check by name. What a pull request does
# run on Windows is test-windows-pr: the packages whose behaviour depends
# on the operating system. macOS runs only in the release workflow, at the
# tag: GitHub's macOS runners can go unassigned for long stretches, so a
# Mac-only break stops a release, never a merge.

permissions:
  contents: read
# No checkout keeps the token in its git configuration
# (persist-credentials: false): no step pushes, and the one git fetch reads
# this public repository anonymously.

# One run per branch: an agent pushing fixups in quick succession should
# not queue stale 3-OS matrices. Master merges are never cancelled — every
# merged commit keeps its full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true   # govulncheck scans the stdlib: always use the newest patch
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      # Tests and scripts stop only the processes they started
      # (docs/DEVELOPMENT.md, "Processes and state in tests").
      - name: no process stops by name
        run: sh scripts/check-process-stops.sh
      # Machine-local tool caches (a PowerShell module analysis cache came
      # in with #197) never belong in the tree.
      - name: no tool caches in the tree
        run: sh scripts/check-tool-caches.sh
      # A v0.6-v0.9 version in a current guide reads as the current minimum
      # (docs/DEVELOPMENT.md, "Version mentions in the documentation").
      - name: no unmarked old versions in the docs
        run: sh scripts/check-doc-versions.sh
      # A copied example must name commands, flags, routes and tools that
      # exist (docs/DEVELOPMENT.md, "Examples in the documentation").
      - name: no stale names in the docs' examples
        run: sh scripts/check-doc-examples.sh
      # The tasks console's script against fake page and hub objects, on
      # the runner's own Node (no setup action, no packages); a failed case
      # exits non-zero and fails the job.
      - name: tasks console harness
        run: |
          node scripts/test-epic-details.mjs
          node scripts/test-features-view.mjs
      # node --check on every console page's script. The test skips where
      # node is missing; here it must run, so a missing node fails it.
      - name: console page scripts parse
        env:
          AIMEM_TEST_REQUIRE_NODE: "1"
        run: go test -count=1 -run '^TestConsoleScriptsSyntax$' ./internal/server/
      # Both tools are tool directives in go.mod: the versions go.sum pins,
      # built on the runner's Go 1.26 like everything else.
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
      RUN: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
    steps:
      - name: on a pull request this leg runs on master
        if: env.RUN != 'true'
        run: echo "The ${{ matrix.os }} tests run on pushes to master, nightly and on release/ pull requests (docs/DEVELOPMENT.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.RUN == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        if: env.RUN == 'true'
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
        if: env.RUN == 'true'
      # internal/installer runs about 8 minutes on the Windows runner, near
      # go test's default 10-minute package timeout; it hit it once
      # (master, 2026-11-14). The explicit limit leaves room; a test that
      # hangs still fails.
      - run: go test -timeout 20m ./...
        if: env.RUN == 'true'
      # The end-to-end identity test races concurrent redemptions against
      # the rig's shared state. The race detector needs cgo, which the
      # Ubuntu runner has; 50 runs keep a lost update from passing by luck.
      - name: identity racing redemptions under the race detector
        if: matrix.os == 'ubuntu-latest' && env.FULL == 'true'
        run: go test -race -count=50 -run '^TestIdentityRoutesEndToEndWithFakeVerifier$' ./internal/server/

  # On a pull request, the Windows tests of the packages whose behaviour
  # depends on the operating system: paths (8.3 short names), git and its
  # environment, file locks and permissions, hooks and the binary swap;
  # and boot.ps1's tests, which run it under Windows PowerShell.
  # Two Windows-only failures reached master on 2026-10-30 (#333, #336)
  # because the full Windows leg runs only there. A release/ pull request
  # runs the full leg instead, and master and nightly skip this job.
  # A pull request that touches the installers, the release workflow's
  # asset list or internal/installer runs the whole internal/installer
  # package here, with master's timeout: #357 changed the installers, ran
  # only boot.ps1's tests before its merge, and the whole package then
  # overran its timeout on master.
  test-windows-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PKGS: >-
        ./internal/wiring/... ./internal/process/... ./internal/processctx/...
        ./internal/childenv/... ./internal/filelock/... ./internal/privatefile/...
        ./internal/taskcred/... ./internal/upgrade/... ./internal/adapter/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - name: go vet
        shell: bash
        run: go vet $PKGS
      - name: go test
        shell: bash
        run: go test $PKGS
      # Whether this pull request touches the installer surface: the diff
      # of the checked-out merge commit against the base branch's tip.
      - name: installer surface touched
        id: installer
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD |
            grep -qE '^(boot\.sh|boot\.ps1|install\.sh|install\.ps1|install-hub\.sh|\.opencode/plugin/aimem\.ts|\.github/workflows/release\.yml|internal/installer/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      # Otherwise only the tests that run boot.ps1 itself: the whole
      # package takes about 8 minutes on the runner, mostly Windows
      # PowerShell starts (about 18 s each). Both forms run under the
      # runner's default shell, as in the full Windows leg.
      - name: boot.ps1 tests
        if: steps.installer.outputs.full != 'true'
        run: go test -v -run '^TestBootPs1' ./internal/installer/
      - name: internal/installer, whole package
        if: steps.installer.outputs.full == 'true'
        run: go test -v -timeout 20m ./internal/installer/

  # The documented usage scenarios (docs/scenarios), run against the real
  # binary started as a hub and as a workstation.
  scenario:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RUN: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') }}
    steps:
      - name: on a pull request this leg runs on master
        if: env.RUN != 'true'
        run: echo "The ${{ matrix.os }} scenarios run on pushes to master, nightly and on release/ pull requests (docs/DEVELOPMENT.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.RUN == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.RUN == 'true'
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # The lint job's vet and staticcheck do not see tagged files.
      - run: go vet -tags scenario ./internal/scenario/...
        if: env.RUN == 'true'
      - run: go test -tags scenario -count=1 -v ./internal/scenario/...
        if: env.RUN == 'true'

  # install-hub.sh's install-only mode (AIMEM_NO_SERVICE=1) in a container
  # without systemd, from a local build: install, serve with the printed
  # command, refuse an upgrade while it runs, upgrade once it is stopped.
  install-hub-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: bash scripts/check-install-hub-container.sh

  # A real client upgrade from the previous release to this tree
  # (scripts/check-client-upgrade.sh): the previous release's one-liner
  # installs it, its own `aimem upgrade` installs an export of the tree, a
  # failed upgrade rolls back, and the lists a session sees after it are the
  # tree's. The previous release comes from the tags (full history). It
  # installs into the runner's account, so it runs on a release prepare pull
  # request from this repository's release/ branches, nightly and on a
  # manual run, never on another pull request; macOS on a release prepare
  # pull request and a manual run (docs/DEVELOPMENT.md, "Release gate").
  client-upgrade:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      # Build on the Go that setup-go installed, never a toolchain that
      # go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - if: runner.os != 'Windows'
        run: bash scripts/check-client-upgrade.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-client-upgrade.ps1

  # A hub's upgrade from the previous release to this tree
  # (scripts/check-hub-upgrade.sh), in the pinned container the hub
  # installer's check uses: the previous release's own install-hub.sh
  # installs its hub, that hub writes a task, a comment, a memory and a
  # team, the tree's install-hub.sh upgrades it, and the tree reads it all
  # back; the state copy is the previous state and each journal is at the
  # tree's schema. It runs where client-upgrade runs; a manual run may name
  # the release to start from (the `from` input), and only a manual run.
  hub-upgrade:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: toolchain is the runner's Go 1.26
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - env:
          AIMEM_UPGRADE_FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.from || '' }}
        run: bash scripts/check-hub-upgrade.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      # Build and test on the Go that setup-go installed, never a toolchain
      # that go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: toolchain is the runner's Go 1.26
        shell: bash
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      # The single static binary is the whole deployment story: CGO off, so
      # it runs on any glibc/musl host without a toolchain.
      - run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      - run: ./aimem state-root
