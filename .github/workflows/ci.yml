name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per branch: an agent pushing fixups in quick succession should
# not queue stale 3-OS matrices. Master merges are never cancelled — every
# merged commit keeps its full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # staticcheck/govulncheck run @latest and may declare a newer Go than
      # our pinned 1.25; let `go run` fetch the toolchain they require.
      # setup-go v7 defaults GOTOOLCHAIN=local, which broke exactly this.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true   # govulncheck scans the stdlib: always use the newest patch
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # The single static binary is the whole deployment story: CGO off, so
      # it runs on any glibc/musl host without a toolchain.
      - run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      - run: ./aimem state-root
