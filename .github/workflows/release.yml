name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# The installers (boot.sh / boot.ps1) resolve "latest" and download these
# assets, so every platform they offer must be built here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test before publishing
        run: go test ./...

      - name: Cross-build static binaries
        env:
          VER: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VER" -o "dist/$3" ./cmd/aimem
          }
          build linux   amd64 aimem-linux-amd64
          build linux   arm64 aimem-linux-arm64
          build darwin  amd64 aimem-darwin-amd64
          build darwin  arm64 aimem-darwin-arm64
          build windows amd64 aimem-windows-amd64.exe
          (cd dist && sha256sum * > SHA256SUMS)

      # The release body is the tag's CHANGELOG section — written by a
      # human (or an agent) about what changed, not an auto-generated
      # commit list. Roll the Unreleased section into the version BEFORE
      # tagging, or the fallback line ships instead.
      - name: Extract changelog section
        env:
          VER: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          awk -v ver="${VER#v}" '
            $0 ~ "^## \\[" ver "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details." > release_notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: dist/*
