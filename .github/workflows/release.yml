name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# The installers (boot.sh / boot.ps1 / install-hub.sh) download these assets
# for the release they pin, so every platform they offer must be built here,
# and every file they read is an asset listed in SHA256SUMS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: read   # each job asks for what it writes

jobs:
  # The attestation names the ref and commit the run started from (its
  # OIDC claims), not what was checked out. A dispatched run must therefore
  # start from the tag it builds, or its files would be attested as built
  # from another ref. First, so a refused run spends no macOS runner.
  ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: A dispatched run starts from its tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::this run started from $GITHUB_REF, not refs/tags/$TAG, and its attestation would name that ref. Start it from the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

  # The macOS tests run here, not on pull requests or master (GitHub's macOS
  # runners can go unassigned for long stretches): a Mac-only failure stops
  # the release instead of a merge (docs/DEVELOPMENT.md, "Which checks run
  # where").
  macos:
    needs: ref
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true
      - name: Toolchain is the runner's Go 1.26
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'
      - run: go vet ./...
      - run: go test ./...
      - name: Native build
        run: CGO_ENABLED=0 go build -o aimem ./cmd/aimem
      # The client installer's launchd agents, against the runner's real
      # launchd: install, upgrade in place, uninstall.
      - name: macOS install registers launchd agents
        run: bash scripts/check-launchd-install.sh

  release:
    needs: [ref, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # the OIDC token the attestation is signed with
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # full history: the guard below needs merge-base

      # Releases ship only what master has merged: refuse to build a tag
      # whose commit is not reachable from master, so a commit that never
      # went through the PR gate cannot become a release just by being
      # tagged.
      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::tagged commit $(git rev-parse --short HEAD) is not on master — merge first, then tag"
            exit 1
          fi

      # The one-liners fetch the boot scripts from this tag, and each script
      # installs the release it pins: a tag whose scripts pin another
      # release would install something else (ADMIN-MANUAL, "Releases").
      - name: Installers pin this tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for f in boot.sh install-hub.sh; do
            grep -qx "RELEASE=$TAG" "$f" || { echo "::error::$f does not pin $TAG"; exit 1; }
          done
          # boot.ps1 is checked out with CRLF (.gitattributes).
          tr -d '\r' < boot.ps1 | grep -qx "\$release = '$TAG'" || { echo "::error::boot.ps1 does not pin $TAG"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true   # the newest 1.26 patch, with its security fixes
          cache: true

      # Build on the Go that setup-go installed, never a toolchain that
      # go.mod would download (docs/DEVELOPMENT.md, "Toolchain").
      - name: Toolchain is the runner's Go 1.26
        run: |
          test "$(go env GOTOOLCHAIN)" = local
          go version | grep -q ' go1\.26'

      - name: Test before publishing
        run: go test ./...

      - name: Cross-build static binaries
        env:
          VER: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VER" -o "dist/$3" ./cmd/aimem
          }
          build linux   amd64 aimem-linux-amd64
          build linux   arm64 aimem-linux-arm64
          build darwin  amd64 aimem-darwin-amd64
          build darwin  arm64 aimem-darwin-arm64
          build windows amd64 aimem-windows-amd64.exe
          # The license travels with the binaries, and SHA256SUMS covers it too.
          cp LICENSE dist/LICENSE
          # So do the installer files: the boot scripts check everything
          # they run against these sums (a Windows install checks boot.ps1
          # itself before running it as a file), and an aiforge export of
          # this release is these assets as published.
          cp boot.sh dist/boot.sh
          cp boot.ps1 dist/boot.ps1
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          cp install-hub.sh dist/install-hub.sh
          cp .opencode/plugin/aimem.ts dist/aimem-opencode.ts
          (cd dist && sha256sum * > SHA256SUMS)

      # The release body is the tag's CHANGELOG section — written by a
      # human (or an agent) about what changed, not an auto-generated
      # commit list. Roll the Unreleased section into the version BEFORE
      # tagging, or the fallback line ships instead.
      - name: Extract changelog section
        env:
          VER: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          awk -v ver="${VER#v}" '
            $0 ~ "^## \\[" ver "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details." > release_notes.md
          fi
          # The notes end with the license and its Required Notice lines,
          # which the license requires to reach everyone who gets a copy.
          notices=$(grep '^Required Notice:' LICENSE) ||
            { echo "::error::LICENSE has no 'Required Notice:' line"; exit 1; }
          {
            printf '\n---\n\n'
            echo "Verify a download against SHA256SUMS before running it. LICENSE is attached and listed there."
            echo
            echo "SHA256SUMS checks that a download arrived intact. To check that this repository's release workflow built it, run: \`gh attestation verify <file> --repo ${{ github.repository }}\`"
            echo
            echo "Licensed under the PolyForm Noncommercial License 1.0.0: https://polyformproject.org/licenses/noncommercial/1.0.0"
            echo
            printf '%s\n' "$notices"
          } >> release_notes.md

      # SHA256SUMS proves a download arrived intact, not who built it: one
      # who could change an asset could change the sums with it. The
      # attestation ties every published file, SHA256SUMS included, to this
      # workflow run at the tag's commit; `gh attestation verify` checks it.
      # Directly before the release step: every step that can fail has run,
      # so no attestation is stored for files that are never published, and
      # a failed attestation publishes nothing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: dist/*
